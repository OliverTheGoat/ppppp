name: Horion Android LeviPack

on:
  push:
    branches:
      - horion-android-levipack
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - horion-android-levipack
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Install Android build tools
        run: |
          sdkmanager "platforms;android-28" "ndk;28.2.13676358"
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Build ARM64 LeviPack
        shell: pwsh
        run: ./scripts/package.ps1 -Abi arm64-v8a

      - name: Validate LeviPack
        run: python scripts/validate_levipack.py build-arm64-v8a

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: horion-android-arm64-v8a
          path: build-arm64-v8a/*.levipack
          if-no-files-found: error

      - name: Publish release asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build-arm64-v8a/*.levipack
